services:
  api:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"] # <- alpine image doesn't have curl
      interval: 30s
      timeout: 5s
      retries: 3
  nginx:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro    # ← main config, not conf.d
    depends_on:
      - api
    restart: unless-stopped

  localstack:
    image: localstack/localstack-pro
    ports:
      - "4566:4566"

    environment:
      - SERVICES=sqs
      - DEBUG=1
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN} # <- Env interpolation for auth token

    volumes:
      - "./localstack:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3